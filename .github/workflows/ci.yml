name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      demonstrate_failure:
        description: Deliberately fail CI to test AI diagnosis
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_NAME: client-ip
  IMAGE_TAG: ${{ github.sha }}
  GHCR_IMAGE: ghcr.io/andymcy/bigid

jobs:
  ci:
    name: Test, scan, and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Demonstrate failure
        if: github.event_name == 'workflow_dispatch' && inputs.demonstrate_failure == true
        run: |
          echo "Intentional failure requested for AI diagnosis demonstration."
          exit 1

      - name: Build image
        run: docker build --tag "${IMAGE_NAME}:${IMAGE_TAG}" .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trivy-report-${{ github.sha }}
          path: trivy-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.21.4

      - name: Validate Helm chart
        run: |
          helm lint ./charts/client-ip
          helm template client-ip ./charts/client-ip

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: bigid
          wait: 120s

      - name: Load image into kind
        run: kind load docker-image "${IMAGE_NAME}:${IMAGE_TAG}" --name bigid

      - name: Deploy to staging
        run: |
          helm upgrade --install client-ip ./charts/client-ip \
            --namespace staging \
            --create-namespace \
            --set-string image.repository="${IMAGE_NAME}" \
            --set-string image.tag="${IMAGE_TAG}" \
            --set image.pullPolicy=IfNotPresent

          kubectl --namespace staging rollout status deployment/client-ip --timeout=120s
          kubectl --namespace staging get pods,service -o wide

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail

          kubectl --namespace staging port-forward service/client-ip 8000:80 >port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid"' EXIT

          health=$(curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health)
          ready=$(curl --fail --silent --show-error http://127.0.0.1:8000/ready)
          client_ip=$(curl --fail --silent --show-error http://127.0.0.1:8000/)
          spoofed_ip=$(curl --fail --silent --show-error --header "X-Forwarded-For: 203.0.113.10" http://127.0.0.1:8000/)

          test "$health" = '{"status":"healthy"}'
          test "$ready" = '{"status":"ready"}'
          test "$client_ip" = "$spoofed_ip"

          echo "Health: $health"
          echo "Ready: $ready"
          echo "Client IP: $client_ip"

      - name: Save image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "${IMAGE_NAME}:${IMAGE_TAG}" | gzip > client-ip-image.tar.gz

      - name: Upload image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: client-ip-image-${{ github.sha }}
          path: client-ip-image.tar.gz
          retention-days: 1

      - name: Write summary
        if: always()
        run: |
          echo "## CI/CD" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${IMAGE_NAME}:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download built image
        uses: actions/download-artifact@v8.0.2
        with:
          name: client-ip-image-${{ github.sha }}

      - name: Load built image
        run: gzip --decompress --stdout client-ip-image.tar.gz | docker load

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${GHCR_IMAGE}:${IMAGE_TAG}"
          docker push "${GHCR_IMAGE}:${IMAGE_TAG}"

      - name: Write publication summary
        if: always()
        run: |
          echo "## GHCR publication" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${GHCR_IMAGE}:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"

  diagnose:
    name: Diagnose failure
    if: ${{ always() && (needs.ci.result == 'failure' || needs.publish.result == 'failure') }}
    needs: [ci, publish]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write

    steps:
      - name: Checkout
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Diagnose with OpenAI
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
        run: python scripts/diagnose_failure.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report skipped diagnosis for fork PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "## AI failure diagnosis" >> "$GITHUB_STEP_SUMMARY"
          echo "Diagnosis skipped for an untrusted fork pull request." >> "$GITHUB_STEP_SUMMARY"
